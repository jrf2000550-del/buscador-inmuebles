<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario — Sofymar IA</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0e1a">
<style>
  :root {
    --bg: #0a0e1a; --bg-elevated: #0f1524; --panel: #141b2e; --panel-2: #1a2338; --panel-3: #202b45;
    --border: #263252; --border-soft: #1d2740; --text: #eef1f8; --muted: #8b95af; --muted-2: #5f6b89;
    --accent: #ea7c52; --accent-2: #b8582f; --accent-light: #ff9d75; --accent-ink: #200d02;
    --ok: #4ade80; --ok-soft: #10281c; --radius-lg: 20px; --radius: 16px; --radius-sm: 11px; --radius-xs: 8px;
    --shadow: 0 12px 32px -12px rgba(0,0,0,.55); --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.6);
    --font: -apple-system, 'Segoe UI', system-ui, Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased;
    background: radial-gradient(1100px 480px at 105% -12%, rgba(234,124,82,.10), transparent),
      radial-gradient(900px 420px at -8% 8%, rgba(45,212,191,.07), transparent), var(--bg);
    min-height: 100vh;
  }
  header { padding: 22px 20px 18px; text-align: center; border-bottom: 1px solid var(--border-soft); }
  header h1 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
  header p { color: var(--muted); font-size: 12.5px; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 90px; }

  .barra-filtros {
    position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px;
    display: flex; gap: 10px; align-items: center; flex-wrap: nowrap;
  }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; flex: 1; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; background: var(--panel-2); border: 1.5px solid var(--border); color: var(--muted);
    font-size: 12.5px; font-weight: 700; padding: 7px 13px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  .chip.activo { background: linear-gradient(135deg, var(--accent-light), var(--accent) 60%, var(--accent-2)); color: var(--accent-ink); border-color: transparent; }
  select#ordenPrecio {
    flex: none; background: var(--panel-2); border: 1.5px solid var(--border); color: var(--text);
    font-size: 12.5px; font-weight: 600; padding: 7px 10px; border-radius: var(--radius-xs); font-family: inherit;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border-soft);
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
  }
  .card .foto-principal { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--panel-3); display: block; cursor: pointer; }
  .card .sin-foto {
    width: 100%; aspect-ratio: 4 / 3; background: var(--panel-3); display: flex; align-items: center; justify-content: center;
    color: var(--muted-2); font-size: 13px;
  }
  .card .miniaturas { display: flex; gap: 4px; padding: 6px 10px 0; overflow-x: auto; }
  .card .miniaturas img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1.5px solid transparent; flex: none; }
  .card .miniaturas img.activa { border-color: var(--accent); }
  .card .cuerpo { padding: 14px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .card .fila-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card .titulo { font-weight: 800; font-size: 14.5px; line-height: 1.3; }
  .card .precio { color: var(--accent-light); font-weight: 800; font-size: 14.5px; white-space: nowrap; }
  .card .badge-op { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: #86efac; text-transform: uppercase; letter-spacing: .02em; }
  .card .specs { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .card .descripcion { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .card .fila-acciones { margin-top: auto; display: flex; gap: 7px; }
  .card .contactar {
    flex: 1; display: block; text-align: center; background: linear-gradient(135deg, #25d366, #128c7e);
    color: #fff; font-weight: 800; border-radius: var(--radius-xs); padding: 10px 12px; font-size: 13px; text-decoration: none;
  }
  .card .btn-pdf {
    flex: none; background: var(--panel-3); border: 1.5px solid var(--border); color: var(--muted);
    font-weight: 700; border-radius: var(--radius-xs); padding: 10px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
  }

  .vacio, .cargando { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 14px; }

  .btn-ia-flotante {
    position: fixed; bottom: 18px; right: 18px; z-index: 20;
    background: linear-gradient(135deg, var(--accent-light), var(--accent) 60%, var(--accent-2)); color: var(--accent-ink);
    border: 0; border-radius: 999px; padding: 13px 18px; font-weight: 800; font-size: 13.5px; cursor: pointer;
    box-shadow: var(--shadow-lg); font-family: inherit;
  }
  .panel-ia {
    position: fixed; bottom: 18px; right: 18px; z-index: 21; width: 340px; max-width: calc(100vw - 24px);
    max-height: 70vh; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--border-soft);
    border-radius: var(--radius); box-shadow: var(--shadow-lg); display: none; flex-direction: column; overflow: hidden;
  }
  .panel-ia.abierto { display: flex; }
  .panel-ia .cabecera-ia {
    padding: 12px 14px; border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .panel-ia .cabecera-ia span { font-weight: 800; font-size: 13px; }
  .panel-ia .cabecera-ia .acciones-cabecera { display: flex; align-items: center; gap: 4px; }
  .panel-ia .cabecera-ia button { background: none; border: 0; color: var(--muted); font-size: 17px; cursor: pointer; line-height: 1; padding: 4px; }
  .panel-ia .cabecera-ia button.activo { color: var(--accent-light); }
  .panel-ia .log-ia { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; -webkit-overflow-scrolling: touch; }
  .panel-ia .msg-usuario { align-self: flex-end; background: var(--accent-soft, #3a2416); color: var(--text); padding: 9px 12px; border-radius: 12px 12px 2px 12px; max-width: 85%; }
  .panel-ia .msg-ia { align-self: flex-start; background: var(--panel-3); color: var(--text); padding: 9px 12px; border-radius: 12px 12px 12px 2px; max-width: 90%; white-space: pre-wrap; line-height: 1.5; }
  .panel-ia .fila-ia { display: flex; gap: 6px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border-soft); }
  .panel-ia .fila-ia input { flex: 1; background: var(--panel-2); border: 1.5px solid var(--border); color: var(--text); border-radius: 999px; padding: 10px 14px; font-size: 14px; font-family: inherit; min-width: 0; }
  .panel-ia .fila-ia button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 15px; font-weight: 800; cursor: pointer; font-family: inherit; flex: none; }
  .btn-mic-ia { width: 40px; height: 40px; padding: 0 !important; border-radius: 999px; background: var(--panel-3) !important; color: var(--text) !important; font-size: 16px; border: 1.5px solid var(--border); }
  .btn-mic-ia.grabando { background: var(--danger, #f36b6b) !important; color: #fff !important; border-color: transparent; animation: pulsar-mic 1.1s infinite; }
  @keyframes pulsar-mic { 0%, 100% { box-shadow: 0 0 0 0 rgba(243,107,107,.5); } 50% { box-shadow: 0 0 0 8px rgba(243,107,107,0); } }

  @media (max-width: 560px) {
    .panel-ia {
      left: 0; right: 0; top: 0; bottom: 0; width: auto; max-width: none; max-height: none;
      border-radius: 0; padding-top: env(safe-area-inset-top);
    }
    .btn-ia-flotante { right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); padding: 13px 18px; font-size: 13.5px; }
  }

  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; padding: 10px; color: #000; background: #fff; }
    #printArea * { color: #000 !important; }
    #printArea .foto-print { width: 100%; max-height: 340px; object-fit: cover; border-radius: 8px; margin: 10px 0; }
    #printArea .miniaturas-print { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
    #printArea .miniaturas-print img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; }
  }
</style>
</head>
<body>

<header>
  <h1 id="tituloHeader">Inventario</h1>
  <p id="subHeader">Cargando...</p>
</header>
<main>
  <div class="barra-filtros" id="barraFiltros" style="display:none">
    <div class="chips" id="chips"></div>
    <select id="ordenPrecio">
      <option value="reciente">Más recientes</option>
      <option value="precioAsc">Precio: menor a mayor</option>
      <option value="precioDesc">Precio: mayor a menor</option>
    </select>
  </div>
  <div id="contenido" class="cargando">Cargando propiedades...</div>
</main>

<button type="button" class="btn-ia-flotante" id="btnAbrirIA">💬 Preguntale a la IA</button>
<div class="panel-ia" id="panelIA">
  <div class="cabecera-ia">
    <span>💬 Preguntale a la IA</span>
    <div class="acciones-cabecera">
      <button type="button" id="btnMutearIA" class="activo" title="Silenciar respuesta hablada">🔊</button>
      <button type="button" id="btnCerrarIA" title="Cerrar">×</button>
    </div>
  </div>
  <div class="log-ia" id="logIA"></div>
  <div class="fila-ia">
    <button type="button" class="btn-mic-ia" id="btnMicIA" title="Hablar">🎤</button>
    <input type="text" id="inputIA" placeholder="Ej: ¿qué terrenos tenés?">
    <button type="button" id="btnEnviarIA">➤</button>
  </div>
</div>

<div id="printArea"></div>

<script>
const $ = (s) => document.querySelector(s);
const agenteId = new URLSearchParams(location.search).get('a');

const ICONO_TIPO = {
  casa: '🏠', departamento: '🏢', terreno: '🏞️', 'terreno-comercial': '🏞️', quinta: '🌳', local: '🏬',
  oficina: '🏢', edificio: '🏙️', deposito: '📦', tinglado: '📦', rural: '🌾', rancho: '🐎', agricolas: '🌾',
  ganaderas: '🐄', cochera: '🚗', hotel: '🏨', colegio: '🏫', proyecto: '🏗️',
};
const NOMBRE_TIPO = {
  casa: 'Casas', departamento: 'Departamentos', terreno: 'Terrenos', 'terreno-comercial': 'Terrenos comerciales',
  quinta: 'Quintas / casas de campo', local: 'Locales comerciales', oficina: 'Oficinas', edificio: 'Edificios',
  deposito: 'Depósitos / galpones', tinglado: 'Tinglados', rural: 'Propiedades rurales', rancho: 'Ranchos',
  agricolas: 'Agrícolas', ganaderas: 'Ganaderas', cochera: 'Cocheras', hotel: 'Hoteles', colegio: 'Colegios',
  proyecto: 'Proyectos (preventa)',
};

let propiedades = [];
let porId = {};
let nombreAgente = '';
let telefonoContacto = '';
let filtroTipo = '';
let orden = 'reciente';

function fmtPrecio(n) {
  return n ? 'U$S ' + Number(n).toLocaleString('es-BO') : 'Consultar precio';
}

function specsLinea(p) {
  return [
    p.dormitorios ? p.dormitorios + ' dorm.' : null,
    p.banos ? p.banos + ' baños' : null,
    p.m2Terreno ? 'terreno ' + p.m2Terreno + ' m²' : null,
    p.m2Construccion ? 'constr. ' + p.m2Construccion + ' m²' : null,
  ].filter(Boolean).join(' · ');
}

function tarjeta(p) {
  const fotos = p.fotos || [];
  const fotoPrincipal = fotos.length
    ? `<img class="foto-principal" id="foto-${p.id}" src="${fotos[0]}" alt="${p.titulo}">`
    : `<div class="sin-foto">Sin fotos todavía</div>`;
  const miniaturas = fotos.length > 1
    ? `<div class="miniaturas">${fotos.map((f, idx) => `<img src="${f}" class="${idx === 0 ? 'activa' : ''}" onclick="cambiarFoto('${p.id}','${f}',this)">`).join('')}</div>`
    : '';
  const msg = encodeURIComponent(`Hola ${nombreAgente}, vi tu propiedad "${p.titulo}" en tu vitrina y me interesa. ¿Seguís disponible?`);
  const contactar = telefonoContacto
    ? `<a class="contactar" href="https://wa.me/${telefonoContacto.replace(/\D/g, '')}?text=${msg}" target="_blank">💬 WhatsApp</a>`
    : '';
  return `
  <div class="card">
    ${fotoPrincipal}
    ${miniaturas}
    <div class="cuerpo">
      <div class="fila-top">
        <span class="titulo">${p.titulo}</span>
        <span class="precio">${fmtPrecio(p.precio)}</span>
      </div>
      <div><span class="badge-op">${p.operacion}</span></div>
      <div class="specs">${p.tipo}${p.zona ? ' · ' + p.zona : ''}${specsLinea(p) ? '<br>' + specsLinea(p) : ''}</div>
      ${p.descripcion ? `<div class="descripcion">${p.descripcion}</div>` : ''}
      <div class="fila-acciones">
        ${contactar}
        <button type="button" class="btn-pdf" onclick="descargarPDF('${p.id}')">📄 PDF</button>
      </div>
    </div>
  </div>`;
}

function cambiarFoto(id, url, el) {
  $('#foto-' + id).src = url;
  el.parentElement.querySelectorAll('img').forEach((i) => i.classList.remove('activa'));
  el.classList.add('activa');
}

function descargarPDF(id) {
  const p = porId[id];
  if (!p) return;
  const fotos = p.fotos || [];
  $('#printArea').innerHTML = `
    <h1 style="margin:0 0 4px">${p.titulo}</h1>
    <p style="margin:0 0 14px;color:#555">${nombreAgente} · Sofymar IA</p>
    ${fotos[0] ? `<img class="foto-print" src="${fotos[0]}">` : ''}
    ${fotos.length > 1 ? `<div class="miniaturas-print">${fotos.slice(1, 7).map((f) => `<img src="${f}">`).join('')}</div>` : ''}
    <p style="font-size:20px;font-weight:800;margin:14px 0 4px">${fmtPrecio(p.precio)} — ${p.operacion.toUpperCase()}</p>
    <p style="margin:0 0 10px">${p.tipo}${p.zona ? ' · ' + p.zona : ''}${specsLinea(p) ? ' · ' + specsLinea(p) : ''}</p>
    ${p.descripcion ? `<p style="margin:0 0 14px">${p.descripcion}</p>` : ''}
    ${telefonoContacto ? `<p style="margin-top:20px">Contacto: ${nombreAgente} — WhatsApp ${telefonoContacto}</p>` : ''}
  `;
  window.print();
}

function renderChips() {
  const porTipo = {};
  for (const p of propiedades) porTipo[p.tipo] = (porTipo[p.tipo] || 0) + 1;
  const tipos = Object.keys(porTipo);
  $('#chips').innerHTML =
    `<button type="button" class="chip ${filtroTipo === '' ? 'activo' : ''}" onclick="elegirTipo('')">🏘️ Todos (${propiedades.length})</button>` +
    tipos.map((t) => `<button type="button" class="chip ${filtroTipo === t ? 'activo' : ''}" onclick="elegirTipo('${t}')">${ICONO_TIPO[t] || ''} ${NOMBRE_TIPO[t] || t} (${porTipo[t]})</button>`).join('');
}

function elegirTipo(t) {
  filtroTipo = t;
  renderChips();
  renderGrid();
}

function renderGrid() {
  let lista = filtroTipo ? propiedades.filter((p) => p.tipo === filtroTipo) : propiedades.slice();
  if (orden === 'precioAsc') lista.sort((a, b) => (a.precio || Infinity) - (b.precio || Infinity));
  else if (orden === 'precioDesc') lista.sort((a, b) => (b.precio || -Infinity) - (a.precio || -Infinity));
  $('#contenido').className = 'grid';
  $('#contenido').innerHTML = lista.length
    ? lista.map(tarjeta).join('')
    : '<p class="vacio" style="grid-column:1/-1">No hay propiedades en esta categoría.</p>';
}

$('#ordenPrecio').addEventListener('change', (e) => {
  orden = e.target.value;
  renderGrid();
});

async function iniciar() {
  if (!agenteId) {
    $('#subHeader').textContent = 'Link inválido.';
    $('#contenido').className = 'vacio';
    $('#contenido').textContent = 'Falta el identificador de la vitrina en el link.';
    return;
  }
  try {
    const resp = await fetch('/api/vitrina/' + agenteId);
    if (!resp.ok) {
      $('#subHeader').textContent = 'No encontrada.';
      $('#contenido').className = 'vacio';
      $('#contenido').textContent = 'Esta vitrina no existe o ya no está disponible.';
      return;
    }
    const data = await resp.json();
    propiedades = data.propiedades;
    porId = Object.fromEntries(propiedades.map((p) => [p.id, p]));
    nombreAgente = data.agente.nombre;
    telefonoContacto = data.agente.telefonoContacto;
    document.title = 'Inventario de ' + nombreAgente + ' — Sofymar IA';
    $('#tituloHeader').textContent = 'Inventario de ' + nombreAgente;
    $('#subHeader').textContent = propiedades.length
      ? propiedades.length + ' propiedad(es) disponible(s)'
      : 'Todavía no hay propiedades cargadas';
    if (!propiedades.length) {
      $('#contenido').className = 'vacio';
      $('#contenido').textContent = 'Todavía no hay propiedades disponibles en este inventario.';
      return;
    }
    $('#barraFiltros').style.display = 'flex';
    renderChips();
    renderGrid();
  } catch {
    $('#subHeader').textContent = 'Error al cargar.';
    $('#contenido').className = 'vacio';
    $('#contenido').textContent = 'No se pudo cargar la vitrina — intentá de nuevo en un momento.';
  }
}
iniciar();

// ---------- Chat con IA sobre el inventario ----------
$('#btnAbrirIA').addEventListener('click', () => {
  $('#panelIA').classList.add('abierto');
  if (!$('#logIA').children.length) {
    agregarMensajeIA('Preguntame qué tiene disponible ' + (nombreAgente || 'el agente') + '. Por ejemplo: "¿qué terrenos tenés?" o "casas bajo 150000".');
  }
  $('#inputIA').focus();
});
$('#btnCerrarIA').addEventListener('click', () => $('#panelIA').classList.remove('abierto'));

function agregarMensajeUsuario(texto) {
  const div = document.createElement('div');
  div.className = 'msg-usuario';
  div.textContent = texto;
  $('#logIA').appendChild(div);
  $('#logIA').scrollTop = $('#logIA').scrollHeight;
}
function agregarMensajeIA(texto) {
  const div = document.createElement('div');
  div.className = 'msg-ia';
  div.textContent = texto;
  $('#logIA').appendChild(div);
  $('#logIA').scrollTop = $('#logIA').scrollHeight;
}

async function preguntarIA() {
  const input = $('#inputIA');
  const pregunta = input.value.trim();
  if (!pregunta) return;
  agregarMensajeUsuario(pregunta);
  input.value = '';
  agregarMensajeIA('Buscando...');
  const placeholder = $('#logIA').lastElementChild;
  try {
    const resp = await fetch('/api/vitrina/' + agenteId + '/preguntar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pregunta }),
    });
    const data = await resp.json();
    const texto = data.respuesta || data.error || 'No pude responder esa pregunta.';
    placeholder.textContent = texto;
    if (data.respuesta) hablar(data.respuesta);
  } catch {
    placeholder.textContent = 'Error al consultar la IA — intentá de nuevo.';
  }
}
$('#btnEnviarIA').addEventListener('click', preguntarIA);
$('#inputIA').addEventListener('keydown', (e) => { if (e.key === 'Enter') preguntarIA(); });

// Respuesta hablada — se puede silenciar con el botón 🔊/🔇 de la cabecera.
let vozActiva = true;
$('#btnMutearIA').addEventListener('click', () => {
  vozActiva = !vozActiva;
  $('#btnMutearIA').textContent = vozActiva ? '🔊' : '🔇';
  $('#btnMutearIA').classList.toggle('activo', vozActiva);
  if (!vozActiva && 'speechSynthesis' in window) window.speechSynthesis.cancel();
});
function hablar(texto) {
  if (!vozActiva || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-BO';
  window.speechSynthesis.speak(u);
}

// Dictado por voz de la pregunta — click para empezar, click de nuevo para
// terminar (no apretar y mantener).
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $('#btnMicIA').style.display = 'none';
} else {
  let recIA = null;
  let grabandoIA = false;
  $('#btnMicIA').addEventListener('click', () => {
    if (grabandoIA) { recIA.stop(); return; }
    recIA = new SR();
    recIA.lang = 'es-BO';
    recIA.continuous = false;
    recIA.interimResults = false;
    recIA.onresult = (e) => { $('#inputIA').value = e.results[0][0].transcript; };
    recIA.onend = () => {
      grabandoIA = false;
      $('#btnMicIA').classList.remove('grabando');
      if ($('#inputIA').value.trim()) preguntarIA();
    };
    recIA.onerror = () => { grabandoIA = false; $('#btnMicIA').classList.remove('grabando'); };
    recIA.start();
    grabandoIA = true;
    $('#btnMicIA').classList.add('grabando');
  });
}
</script>
</body>
</html>
